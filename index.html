/* Layout: phone-first app column — hero band with search, quick calculator chips, chamber sections, detail view per tool, fixed bottom bar */
:root{
  --bg:#f1f1f6; --surface:#ffffff; --surface-2:#f6f6fa; --fg:#14172b; --muted:#585c75; --line:#dcdce8;
  --accent:#2d3a8c; --accent-ink:#ffffff; --accent-soft:#e3e6f7; --band:#1c2559; --band-2:#2d3a8c; --band-ink:#eef0fb;
  --ok:#00588a; --ok-soft:#dcebf7; --caution:#7a4d00; --caution-soft:#fdf0c4; --warn:#9b1f63; --warn-soft:#f7e0ee; --warn-solid:#9b1f63; --warn-ink:#ffffff;
  --info-soft:#e8eef9; --info:#2c4c8c; --shadow:0 1px 2px rgba(16,40,48,.06),0 4px 14px rgba(16,40,48,.06);
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f1d; --surface:#161a2e; --surface-2:#1d2238; --fg:#e8eaf6; --muted:#a0a5c4; --line:#2a3050;
  --accent:#9db0ff; --accent-ink:#0c1030; --accent-soft:#232a5a; --band:#121744; --band-2:#222b74; --band-ink:#e3e7ff;
  --ok:#6cc3f5; --ok-soft:#10304a; --caution:#f0d95c; --caution-soft:#3a3410; --warn:#f2a4cf; --warn-soft:#431a33; --warn-solid:#f2a4cf; --warn-ink:#3b0f28;
  --info-soft:#18243b; --info:#a3bbee; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f1d; --surface:#161a2e; --surface-2:#1d2238; --fg:#e8eaf6; --muted:#a0a5c4; --line:#2a3050;
  --accent:#9db0ff; --accent-ink:#0c1030; --accent-soft:#232a5a; --band:#121744; --band-2:#222b74; --band-ink:#e3e7ff;
  --ok:#6cc3f5; --ok-soft:#10304a; --caution:#f0d95c; --caution-soft:#3a3410; --warn:#f2a4cf; --warn-soft:#431a33; --warn-solid:#f2a4cf; --warn-ink:#3b0f28;
  --info-soft:#18243b; --info:#a3bbee; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:620px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.band{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--band),var(--band-2));color:var(--band-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 22px;border-radius:0 0 22px 22px}
.band::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;border:26px solid currentColor;opacity:.07;box-shadow:0 0 0 30px transparent,inset 0 0 0 34px transparent;pointer-events:none}
.band::before{content:"";position:absolute;right:8px;top:-12px;width:104px;height:104px;border-radius:50%;border:14px solid currentColor;opacity:.06;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.mark{width:42px;height:42px;flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1.05}
.brand p{margin:3px 0 0;font-size:12px;opacity:.82;letter-spacing:.07em;text-transform:uppercase}
.hsearch{position:relative;margin-top:16px}
.hsearch input{width:100%;padding:12px 14px 12px 42px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:var(--band-ink);font:16px var(--body)}
.hsearch input::placeholder{color:var(--band-ink);opacity:.7}
.hsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.8}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;flex-direction:column;gap:12px}

.note{background:var(--info-soft);color:var(--info);border-radius:14px;padding:10px 14px;font-size:13px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (min-width:700px){.chips{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0 6px}}
#side{display:none}
@media (min-width:1100px){
 #side{display:block;position:fixed;top:0;bottom:0;right:calc(50% + 326px);width:min(240px,calc(50vw - 340px));overflow-y:auto;padding:18px 4px 24px 12px;font-size:13px}
 #side h4{margin:14px 0 4px;font:600 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
 #side h4:first-child{margin-top:0}
 #side button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;color:var(--fg);font:inherit;cursor:pointer;line-height:1.3}
 #side button:hover{background:var(--accent-soft)}
 #side button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
 #side button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
}
.chip{flex:none;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.chip i{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 10.5px var(--mono);font-style:normal}
.chip:hover{border-color:var(--accent)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.group>button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;background:none;border:0;cursor:pointer;text-align:left}
.sicon{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.sicon svg{width:26px;height:26px}
.group>button .gt{flex:1;min-width:0;display:flex;flex-direction:column}
.group>button .gt b{font-family:var(--display);font-weight:600;font-size:19.5px;line-height:1.15}
.group>button .gt small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:18px;height:18px;transition:transform .2s;flex:none;color:var(--muted)}
.group.open .chev{transform:rotate(180deg)}
.items{display:none;border-top:1px solid var(--line)}
.group.open .items{display:block}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none;border:1px solid var(--line)}
.ico.calc{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ico svg{width:16px;height:16px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:550;line-height:1.3}
.item .t small{color:var(--muted);font-size:12.5px}
.kind{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 5px;flex:none}
.fav{background:none;border:0;cursor:pointer;padding:6px;color:var(--muted);flex:none;border-radius:8px}
.fav.on{color:var(--warn)}
.fav svg{width:20px;height:20px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px 0}

/* detail */
.dhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:10px}
.dhead h2{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.2;text-wrap:balance}
.back{background:var(--surface-2);border:1px solid var(--line);cursor:pointer;padding:7px;border-radius:10px;display:grid;place-items:center}
.back svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}

  table:'Table 57',howto:['Aortic regurgitation uses CMR outcome studies: regurgitant fraction ≥32% (Hashimoto 2022; Myerson 2012 >33%), LVESVi ≥45 mL/m² (Hashimoto), LVEDV >246 mL (Myerson) and regurgitant volume >40 mL by direct flow (Polte 2017; the Myerson volume cutoff is not in its abstract and is reported inconsistently, so it is not used). Mild <15% is from Steeds & Myerson 2020; the moderate band is not outcome-derived. The SCMR Table 57 echo values (RF ≥50%, RVol ≥60 mL, EROA ≥0.30 cm²) are replaced. See the aortic regurgitation calculator.','Mitral regurgitation uses CMR outcome studies (LV stroke volume − aortic forward flow): primary severe RF >40% / RVol >55 mL (Myerson 2016), RVol ≥60 mL for mortality (Penicka 2018), mild <20% from Steeds & Myerson 2020 (moderate is the gap, not outcome-derived); secondary RF ≥20% moderate and ≥35% severe (Wang 2023). EROA is an echo measure and is not used. See the mitral regurgitation calculator.','Tricuspid regurgitation uses CMR outcome studies (indirect method): TRF 20% and 40% from Margonato 2025, ≥50% / ≥45 mL highest risk from Zhan 2020. Pulmonic regurgitation uses the ASE 2017 CMR consensus (not outcome-derived); in repaired tetralogy see the RV page. See the tricuspid regurgitation calculator.','Stenosis: no CMR cutoff for any valve is outcome-validated. CMR-specific numbers shown are agreement-based (AS planimetry grey zone; MS <1.65 cm²; conduit <18 mm) or from UK Biobank mild AS (Kany 2025). Phase contrast under-reads velocity and gradient, so a low value never excludes severe stenosis. See the stenosis calculators.','All other grades are borrowed from echocardiography (2014/2017 AHA/ACC valve guidelines), not derived from CMR outcome data.','CMR-specific regurgitation thresholds are a priority for the outcomes layer of this app.'],keys:'valve regurgitation stenosis mitral aortic tricuspid grading severity'},

function rvGradeTable(it,s){const ctx=s.ctx||'gen';const R=k=>{const {v}=refFor(it,s,k);return v};const e=R('edvi'),es=R('esvi');

const EV_PAGES={
 'lv-ev':{list:()=>LV_EV,bottom:`<li><b>LVEDVi:</b> Kang 2026 is the only sex-specific graded scheme on CMR. Only severe (≥200 men, ≥170 women) is outcome-derived; moderate is a midpoint and mild is the normal limit. Valid for DCM/ICM with papillary muscles in the blood pool; not for valve disease or preserved LVEF.</li>
  <li><b>LVESVi:</b> no graded outcome scheme anywhere. Reference flag in general; ≥45 mL/m² in aortic regurgitation (Hashimoto 2022).</li>
  <li><b>LVEF:</b> below the normal limit is validated (MESA). Severity uses HF guideline categories (≤40, 41–49), which are trial/echo-based. Above 70% is a risk marker, not a diagnosis.</li>
  <li><b>LV mass:</b> outcome risk starts at +1 SD in men and +2 SD in women (MESA), so the flag is sex-specific.</li>
  <li><b>Small LV:</b> U-shaped risk in two cohorts; a small LV with high EF may deserve a comment.</li>
  <li><b>Critiques:</b> no editorial targets the Kang tiers. Criticism is methodological: SD limits were unvalidated until MESA 2025, contouring changes mass and volumes, and supranormal LVEF is debated.</li>`},
 'la-ev':{list:()=>LA_EV,bottom:`<li><b>Max LAVi:</b> only one outcome-validated CMR scale (Khan 2019, biplane): moderate >62 and severe >73 mL/m² predicted death. Simpson volumes rely on the untested EACVI partitions.</li>
  <li><b>Min LAVi:</b> often more prognostic than max, but no tiers yet.</li>
  <li><b>LACI:</b> >25% predicted AF and HF in MESA; disease-specific cutoffs vary widely.</li>
  <li><b>LA strain:</b> prognostic but software-dependent; not graded.</li>
  <li><b>Echo cutoffs:</b> do not apply. The healthy CMR mean (about 36 mL/m²) already exceeds the echo threshold of 34.</li>
  <li><b>Critiques:</b> no letter or editorial targeting a specific CMR LA cutoff was found; criticism is methodological (SD-based limits, small samples, method dependence).</li>`},
 'tr-ev':{list:()=>TR_EV,bottom:`<li><b>TRF:</b> mild &lt;20%, moderate 20–39%, severe ≥40% (Margonato 2025, censored at intervention), highest risk ≥50% (Zhan 2020). No cutoff replicated independently.</li>
  <li><b>RV:</b> effective RVEF ≤25% is the only externally validated TR-related CMR cutoff. Hinojar 2025 RVEDVi/RVEF tiers for severe TR.</li>
  <li><b>Method:</b> all cutoffs assume RV stroke volume − pulmonary forward flow; 4D flow values are not interchangeable.</li>

 'mr-ev':{list:()=>MR_EV,bottom:`<li><b>Primary MR:</b> severe RF &gt;40% and RVol &gt;55 mL (Myerson 2016, circular endpoint); RVol ≥60 mL predicted death (Penicka 2018). Mild limit (&lt;20%) from Steeds & Myerson 2020; the moderate band is not outcome-derived.</li>
  <li><b>Secondary MR:</b> RF ≥20% moderate and ≥35% severe, outcome-derived (Wang 2023, single institution). Prognostic weight depends on scar. RVol not graded.</li>
  <li><b>Method:</b> cutoffs assume LV stroke volume − aortic forward flow; mitral inflow gives lower thresholds (Polte 2017).</li>
  <li><b>Echo cutoffs:</b> RF ≥50% under-calls CMR severity; echo RVol runs 8–17 mL higher.</li>
  <li><b>MVP:</b> papillary/inferolateral LGE predicts arrhythmic events; annular disjunction alone does not.</li>
  <li><b>Critiques:</b> no letter disputes the cutoffs directly; editorials stress method dependence and reading RF with scar.</li>`},
 'av-ev':{list:()=>AV_EV,bottom:`<li><b>AR (used in the calculator):</b> severe RF ≥32% (Hashimoto 2022; Myerson 2012 &gt;33%), LVESVi ≥45 mL/m² (Hashimoto), LVEDV &gt;246 mL (Myerson); RVol &gt;40 mL direct (Polte 2017). Mild &lt;15% from Steeds & Myerson. Moderate is not outcome-derived.</li>
  <li><b>AR alternatives not used:</b> Malahfji 2023 (RF 43%, RVol 47 mL, LVESVi 43, LVEDVi 109) and the echo-borrowed RF ≥50%.</li>
  <li><b>Circularity:</b> most AR studies count surgery as an outcome; Hashimoto and Kammerlander are the cleanest.</li>
  <li><b>AS:</b> no CMR-specific severe cutoff. Planimetry reads larger and phase contrast reads lower than echo, so echo thresholds under-call severity on CMR.</li>
  <li><b>AS myocardium:</b> LGE and ECV &gt;27% predict death, but EVOLVED did not show that early AVR for fibrosis improves the primary outcome.</li>
  <li><b>Critiques:</b> no letters target specific cutoffs. Criticism centres on surgical endpoints, flow-measurement error, indexing in women and borrowed echo numbers.</li>`},
 'rv-ev':{list:()=>RV_EV,bottom:`<li><b>RVEF:</b> the best-supported RV metric. 45% and 40% are supported by CMR outcome cohorts; the 30% severe cutoff is a 3D-echo extrapolation. Disease-specific cutoffs: TR &lt;50% high risk, PAH &lt;37% high risk.</li>
  <li><b>RV/LV ratio:</b> only severe (≥2.30) is outcome-derived, from 8 deaths in 62 PH patients; mild and moderate are not outcome-distinct. Not usable with biventricular dilation or a small LV.</li>
  <li><b>RVEDVi/RVESVi:</b> reference flags only in general; TR (100/150 mL/m²) and repaired TOF (RVESVi &gt;80) have disease-specific thresholds. ARVC volume criteria are diagnostic, not prognostic.</li>
  <li><b>MESA:</b> RVESVi and RVEF beyond 2 SD did not predict events in asymptomatic adults, so RV grading matters most in known disease.</li>
  <li><b>Critiques:</b> none target Altmayer directly. Badano and Al'Aref debated graded vs single RVEF cutoffs; letters criticise the ARVC volume cutoffs; Pastor 2020 challenges TOF PVR thresholds.</li>`}

 let h=`<div class="card"><h3>Severity grading (draft)</h3><div class="scroll"><table class="tbl"><thead><tr><th>Parameter</th><th>Normal</th><th>Mild</th><th>Moderate</th><th>Severe</th></tr></thead><tbody>
  <tr><th>Max LA volume/BSA <span class="ref">mL/m²</span></th><td>≤${ul}</td><td>${ul+1}–${mi}</td><td>${mi+1}–${mo}</td><td>&gt;${mo}</td></tr>
  <tr><th>LACI <span class="ref">%</span></th><td>≤25</td><td colspan="3">&gt;25 abnormal</td></tr></tbody></table></div>
 <span class="ref"><b>Max LAVi:</b> normal limit from SCMR 2025 for this sex and method. ${bi?'Mild, moderate and severe follow Khan et al., JCMR 2019 (10,890 patients, biplane area-length, appendage and veins excluded): moderate and severe independently predicted death (aHR 1.45 and 1.64); mild did not. Their own normal limit was 52; the SCMR limit is used here.':'Tiers follow the EACVI 2019 consensus (2/3/4 SD bands from 120 volunteers, 3D volumes with the appendage included). Provisional: never tested against outcomes. No outcome-based tiers exist for Simpson volumes.'} The two methods differ by about 7 mL/m², roughly one tier, so grade only with the matching method.</span>
 <span class="ref"><b>Min LAVi and LA emptying fraction:</b> shown as normal or abnormal against SCMR limits. Min LAVi often predicts outcomes better than max (DCM, post-MI), but no severity tiers exist yet.</span>
 <span class="ref"><b>LACI:</b> minimal LA volume ÷ LVEDV. &gt;25% predicted AF and HF in MESA (Pezel 2021; 4,124 adults). Disease cohorts use 21–46%, and some divide LA volume at LV end-diastole instead, so this is a flag rather than a grade. Enter LVEDV to calculate it.</span>
 <span class="ref"><b>LA strain:</b> not included. Reservoir strain in the same patients ranged from 24% to 45% across software packages, so fixed cutoffs do not transfer.</span>
 <button class="link" data-open="la-ev">See the evidence and critiques</button></div>`;
 return h}

// SCMR 2025 Table 90: normal ECV by field strength, vendor and sequence [label, mean, SD, LL, UL]
const ECV_REF={'1.5':[['Philips · MOLLI 3b(3s)3b(3s)5b',27.7,5.9,15.9,39.5],['Siemens · MOLLI 5s(3s)3s',27.3,2.7,21.9,32.7],['Siemens · MOLLI 3b(3s)3b(3s)5b',25.0,3.0,19.0,31.0],['Siemens · ShMOLLI',28.4,3.0,22.4,34.4],['Siemens · SASHA',24.1,2.9,18.3,29.9]],
 '3':[['Siemens · MOLLI 5s(3s)3s',27.3,2.4,22.5,32.1],['Siemens · ShMOLLI',24.6,2.5,19.6,29.6],['Siemens · SASHA',19.8,1.8,16.2,23.4]]};
const T1_055=[['Mayr 2026','678.6 ± 13.5','n=10','10.1097/RLI.0000000000001225'],['Liu 2026','671 ± 31','MOLLI, n=18','10.1002/jmri.70239'],['Pedraza 2025','672 ± 40','MOLLI, n=15','10.1002/nbm.70143'],['De la Sotta 2025','681 ± 26','2D MOLLI, n=10','10.1002/mrm.70038'],['Si 2024','630 ± 25','MOLLI, n=10','10.1002/mrm.30139']];
function ecvResults(){const st=ecvState,n=k=>parseFloat(st[k]);const hct=n('hct'),mp=n('mpre'),mq=n('mpost'),bp=n('bpre'),bq=n('bpost'),mn=n('min');
 let h='<h3>Results</h3>';const warn=[];
 if(!(hct>0&&mp>0&&mq>0&&bp>0&&bq>0))return h+'<p class="empty">Enter measured hematocrit and the four T1 values.</p>';
 const H=hct>1?hct/100:hct;
 if(H<0.15||H>0.7)warn.push('Hematocrit looks implausible; enter it as % (e.g., 42).');
 if(mq>=mp||bq>=bp)warn.push('Post-contrast T1 must be shorter than native T1. Check the values are not swapped.');
 if(mn>0&&(mn<10||mn>30))warn.push('Post-contrast map should be 10–30 min after contrast (SCMR/EACVI 2017).');
 if(H<0.30)warn.push('Anaemia: ECV error increases with low hematocrit (SCMR 2025).');
 const dm=1/mq-1/mp,db=1/bq-1/bp;
 if(!(dm>0&&db>0))return h+`<p class="empty">${warn.join(' ')||'Check inputs.'}</p>`;
 const lam=dm/db,ecv=(1-H)*lam*100;
 let pill,basis,bar='',c;const fld=st.f;const R=(ECV_REF[fld]||[])[parseInt(st.seq)];
 if(R&&st.seq!==''){const [lab,mn,sd,ll,ul]=R;c=ecv>ul?'hi':ecv<ll?'lo':'ok';pill=AVP(c,c==='hi'?`Above reference (&gt;${ul}%)`:c==='lo'?`Below reference (&lt;${ll}%)`:'Within reference range');basis=`SCMR 2025 Table 90 · ${lab}: ${mn} ± ${sd}% (${ll}–${ul}%)`;bar=rangeBar(ecv,[mn,sd,ll,ul],c)}
 else if(ecv>36){pill=AVP('hi','Elevated (above most published upper limits)');basis='Published upper limits of normal vary from about 29% to 36% by site and sequence'}
 else if(ecv>29){pill=AVP('lo','Borderline: compare with your sequence range');basis='Published upper limits of normal vary from about 29% to 36%. Pick a reference set above for the SCMR range'}
 else if(ecv<20){pill=AVP('lo','Low: check timing and inputs');basis='Pooled healthy mean 25.9% (Gottbrecht 2018)'}
 else{pill=AVP('ok','Within typical normal range');basis='Pooled healthy mean 25.9% at 1.5 T and 3 T (Gottbrecht 2018)'}
 const rr=(l,u,v,body)=>`<div class="rrow"><div class="rl"><b>${l}</b><small>${u}</small></div><div class="rv">${v}</div>${body}</div>`;
 h+=`<div class="rlist">`+rr('ECV','%',ecv.toFixed(1),`${bar}<div class="rs">${pill}<span class="ref">${basis}${fld==='0.55'?'. No healthy ECV norms published at 0.55 T; the 1.5 T range is applied on the basis that ECV is field-independent (SCMR 2025)':''}</span></div>`)
  +rr('Partition coefficient λ','ΔR1 myocardium ÷ ΔR1 blood',lam.toFixed(3),'')
  +rr('ΔR1 myocardium','s⁻¹ · 1/T1 post − 1/T1 pre',(dm*1000).toFixed(3),'')
  +rr('ΔR1 blood','s⁻¹ · 1/T1 post − 1/T1 pre',(db*1000).toFixed(3),'')
  +rr('Native myocardial T1','ms',mp.toFixed(0),`<div class="rs"><span class="ref">${fld==='0.55'?'0.55 T volunteer means 630–681 ms (MOLLI, n=10–18); no normal range yet':'Compare with the SCMR table for your vendor and sequence (pooled mean '+(fld==='3'?'1159':'976')+' ms)'}</span></div>`)+`</div>`;
 if(warn.length)h+=`<span class="ref" style="color:var(--warn)"><b>Check:</b> ${warn.join(' ')}</span>`;
 return h}
function ecvView(it){const st=ecvState;
 const f=(k,l,u,ph)=>`<div class="row"><label for="ecv-${k}">${l}</label><input id="ecv-${k}" type="number" inputmode="decimal" step="any" data-ecv="${k}" value="${esc(st[k])}" placeholder="${ph||''}"><span class="u">${u}</span></div>`;
 const pre=st.f==='0.55'?'680':st.f==='3'?'1200':'1000',bpre=st.f==='0.55'?'1100':st.f==='3'?'1900':'1550';
 let h=`<div class="dhead"><button class="back" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><h2>${esc(it.title)}</h2><button class="fav ${isFav(it.id)?'on':''}" data-fav="${it.id}" aria-label="Favorite">${isFav(it.id)?HEART_ON:HEART}</button></div><div class="wrap">`;
 h+=`<div class="card"><div class="field"><label class="lbl" for="ecv-f">Field strength</label><select id="ecv-f" data-ecv="f">${[['0.55','0.55 T'],['1.5','1.5 T'],['3','3 T']].map(([v,t])=>`<option value="${v}" ${st.f===v?'selected':''}>${t}</option>`).join('')}</select></div>
  ${ECV_REF[st.f]?`<div class="field"><label class="lbl" for="ecv-seq">Reference set (SCMR 2025, optional)</label><select id="ecv-seq" data-ecv="seq"><option value="">Generic range</option>${ECV_REF[st.f].map((r,i)=>`<option value="${i}" ${st.seq===String(i)?'selected':''}>${r[0]} · ${r[3]}–${r[4]}%</option>`).join('')}</select></div>`:''}
  ${f('hct','Measured hematocrit','%','42')}<span class="ref">Measured, not synthetic. Draw immediately before the scan if possible, otherwise within 24 h.</span>
  <h3>Myocardium (septum)</h3>${f('mpre','Native T1','ms',pre)}${f('mpost','Post-contrast T1','ms','450')}
  <h3>Blood pool (LV cavity)</h3>${f('bpre','Native T1','ms',bpre)}${f('bpost','Post-contrast T1','ms','300')}
  ${f('min','Time after contrast','min','15')}</div>`;
 h+=`<div class="card" id="results">${ecvResults()}</div>`;
 h+=`<div class="card"><h3>Formula</h3><ul class="howto">
  <li>λ = (1/T1<sub>myo,post</sub> − 1/T1<sub>myo,pre</sub>) ÷ (1/T1<sub>blood,post</sub> − 1/T1<sub>blood,pre</sub>)</li>
  <li>ECV = (1 − hematocrit) × λ, reported as % (Messroghli 2017, SCMR/EACVI consensus).</li></ul>
  <h3>How to measure</h3><ul class="howto">
  <li>Post-contrast map 10–30 min after an extracellular gadolinium agent (0.1–0.2 mmol/kg). With split doses (stress perfusion), time from the last dose.</li>
  <li>Same slice, same sequence before and after contrast. ROI in the mid-ventricular septum; blood ROI in the LV cavity away from papillary muscles and trabeculations.</li>
  <li>MOLLI-type sequences need Look-Locker correction (done by the scanner).</li>
  <li>ECV is reported as field-independent when the same agent and molar dose are used, but sites should set local reference ranges.</li></ul>
  <h3>Field strength notes</h3><ul class="howto">
  <li><b>1.5 T and 3 T:</b> pooled healthy ECV 25.9% at both (Gottbrecht 2018, 3,872 subjects). Published upper limits vary from about 29% to 36%; SCMR 2025 sequence-specific ranges are in the reference-set menu. ECV is slightly higher in women and rises with BMI.</li>
  <li><b>0.55 T:</b> no ECV reference values in healthy people have been published. Native T1 is about 32% shorter than at 1.5 T; small volunteer studies report septal MOLLI means of 630–681 ms. Treat 0.55 T results as provisional.</li></ul>
  <button class="link" data-open="t1">SCMR native T1 and ECV tables by vendor (1.5 T, 3 T)</button></div>`;
 h+=`<div class="card"><h3>Sources</h3><ul class="howto">
  <li class="ref">Messroghli DJ, et al. SCMR/EACVI T1 mapping consensus. J Cardiovasc Magn Reson 2017. <a href="https://doi.org/10.1186/s12968-017-0389-8" target="_blank" rel="noopener" style="color:var(--accent)">doi:10.1186/s12968-017-0389-8</a></li>
  <li class="ref">Kawel-Boehm N, et al. SCMR reference values 2025. <a href="https://doi.org/10.1016/j.jocmr.2025.101853" target="_blank" rel="noopener" style="color:var(--accent)">doi:10.1016/j.jocmr.2025.101853</a></li>
  <li class="ref">Gottbrecht M, et al. Native T1 and ECV in healthy subjects: meta-analysis. Radiology 2018. <a href="https://doi.org/10.1148/radiol.2018180226" target="_blank" rel="noopener" style="color:var(--accent)">doi:10.1148/radiol.2018180226</a></li>
  <li class="ref">Campbell-Washburn AE, et al. 0.55 T cardiac MRI. Radiology 2019. <a href="https://doi.org/10.1148/radiol.2019190452" target="_blank" rel="noopener" style="color:var(--accent)">doi:10.1148/radiol.2019190452</a></li>
  ${T1_055.map(([a,v,d,doi])=>`<li class="ref">${a}: 0.55 T native T1 ${v} ms (${d}). <a href="https://doi.org/${doi}" target="_blank" rel="noopener" style="color:var(--accent)">doi:${doi}</a></li>`).join('')}</ul></div>`;
 return h+'</div>'}

function avResults(id){const st=avState[id];const n=k=>parseFloat(st[k]);const bsa=n('bsa');const rows=[];
 const add=(l,u,v,pill,b)=>rows.push(`<div class="rrow"><div class="rl"><b>${l}</b><small>${u}</small></div><div class="rv${/^[\d.\-−]+$/.test(String(v))?'':' txt'}">${v}</div><div class="rs">${pill}<span class="ref">${b}</span></div></div>`);
 if(id==='sten-calc'){
  if(st.v==='ms'){const a=n('mva');if(a>0)add('Planimetric MVA (cine)','cm²',a.toFixed(2),a<1.65?AVP('hi','&lt;1.65: consistent with severe (cath ≤1.5)'):AVP('ok','≥1.65: severe less likely'),'Djavidani 2005 (17 with cath; sens 89%, spec 75%). CMR reads 5–8% larger than cath');
   const ph=n('pht');if(ph>0){const x=220/ph;add('Pressure half-time (PC)','ms',ph.toFixed(0),ph>=150?AVP('hi','≥150 ms: severe (echo criterion)'):AVP('ok','&lt;150 ms'),`Area by 220/PHT = ${x.toFixed(2)} cm². CMR PHT feasible (Lin 2004, n=17) but not validated against cath`)}
   const g=n('mg');if(g>0)add('Mean gradient (PC)','mmHg',g.toFixed(0),g>=10?AVP('hi','≥10 (echo)'):AVP('lo','Low reading does not exclude severe'),'PC-MRI underestimates mitral gradients vs Doppler; heart-rate dependent')}
  else if(st.v==='ps'){const v=n('pv');if(v>0)add('Peak velocity (PC)','m/s',v.toFixed(1),v>4?AVP('hi','Severe (&gt;4 m/s, echo-borrowed)'):v>=3?AVP('lo','Moderate (3–4 m/s, echo-borrowed); may under-read'):AVP('lo','&lt;3 m/s: does not exclude obstruction'),'2D PC reads ~0.4 m/s below Doppler; 4D flow closer (Nordmeyer 2012)');
   const c=n('cd');if(c>0)add('Conduit minimal diameter','mm',c.toFixed(0),c<18?AVP('hi','&lt;18 mm: obstruction likely'):AVP('ok','≥18 mm'),'Martinez/Mohiaddin 1992 (n=52; anatomic, not outcome-based)');
   const m=n('rvm'),e=n('rvedv');if(m>0&&e>0){const x=m/e;add('RV mass/volume ratio','g/mL',x.toFixed(2),x>=0.45?AVP('hi','≥0.45: higher death/VT risk'):AVP('ok','&lt;0.45'),'INDICATOR (Geva 2018, repaired TOF, n=452, HR 4.08); mixed pressure and volume load')}}

 }else if(id==='tr-calc'){const rvsv=n('rvsv'),pf=n('pf'),rvedv=n('rvedv'),rvesv=n('rvesv');const ind=st.m==='ind';let rv=null,rf=null;
  if(rvsv>0&&pf>0&&rvsv>pf){rv=rvsv-pf;rf=rv/rvsv*100}
  if(rf!=null){if(!ind)add('TR fraction','%',rf.toFixed(0),AVP('na','Not graded (4D flow)'),'Cutoffs assume the indirect method; 4D flow reads ~16 mL higher, kappa ≤0.07');
   else{const g=rf>=50?AVP('hi','Severe, highest risk (≥50%)'):rf>=40?AVP('hi','Severe (≥40%)'):rf>=20?AVP('lo','Moderate (20–39%)'+(rf>=30?' · elevated':'')):AVP('ok','Mild (&lt;20%)');
    add('TR fraction','%',rf.toFixed(0),g,rf>=50?'Zhan 2020 (n=547, death)':rf>=20?'Margonato 2025 (n=489; 20% risk rises, 40% doubles; censored at intervention)'+(rf>=30&&rf<40?'. ≥30%: Wang 2021 (echo-severe TR only)':''):'Margonato 2025')}}
  if(rv!=null&&ind)add('TR volume','mL',rv.toFixed(0),rv>=45?AVP('hi','Highest risk (≥45 mL)'):rv>=35?AVP('lo','Elevated (35–44 mL)'):AVP('ok','&lt;35 mL'),'Zhan 2020 ≥45; Wang 2021 ≥35. TRF governs when they disagree');
  if(pf>0&&rvedv>0){const x=pf/rvedv*100;add('Effective RVEF (forward flow ÷ RVEDV)','%',x.toFixed(0),x<=25?AVP('hi','≤25%: higher mortality'):AVP('ok','&gt;25%'),'Zhang 2026, externally validated (Houston, Duke)')}
  if(pf>0&&rvesv>0){const x=pf/rvesv;add('Forward SV ÷ RVESV','',x.toFixed(2),x<=0.57?AVP('hi','≤0.57: RV–PA uncoupling'):AVP('ok','&gt;0.57'),'Margonato 2026 (n=631, aHR 2.36)')}

  if(rvedv>0&&rvesv>0&&rvedv>rvesv){const x=(rvedv-rvesv)/rvedv*100;add('RVEF (total)','%',x.toFixed(0),st.teer==='post'?AVP('na','Interpret with caution after T-TEER'):x<50?AVP('hi','High risk (&lt;50%)'):x<=60?AVP('lo','Intermediate (50–60%)'):AVP('ok','&gt;60%'),st.teer==='post'?'A rise in RVEF after T-TEER can mean residual/worse TR (Bombace 2025)':st.teer==='pre'&&x<=45?'Hinojar 2025. Before T-TEER, ≤45% high risk (Kresoja 2021, HR 6.6)':'Hinojar 2025. Volume loading inflates RVEF')}

 }else if(id==='ar-calc'){let rv=null,rf=null;

  const sv=n('sv');let svi=null;if(sv>0&&bsa>0){svi=sv/bsa;add('SV/BSA','mL/m²',svi.toFixed(0),svi<35?AVP('hi','Low flow (&lt;35)'):svi<45?AVP('lo','35–44: higher post-AVR mortality'):AVP('ok','≥45'),'&lt;35 echo-adopted; &lt;45 Thornton 2022 (risk, not diagnostic). CMR SV runs higher than echo')}
  if(ava>0&&ava<=1.3&&(mg>0&&mg<40)){rows.push(`<div class="rnote"><span class="ref"><b>Discordant grading:</b> small valve area with low gradient${svi!=null&&svi<35?' and low flow':''}. Consider CT calcium score (ESC 2025 tiebreaker).</span></div>`)}

  const ecv=n('ecv');if(ecv>0){const post=st.post==='y';add('ECV','%',ecv.toFixed(0),post?AVP('na','Not graded after AVR'):ecv>=38?AVP('hi','Very high: consider amyloid'):ecv>27?AVP('hi','Higher risk (&gt;27%)'):AVP('ok','≤27%'),post?'ECV can rise after AVR':'Kwak 2021 &gt;27%; Lee 2024 &gt;28.6%. Method-dependent; amyloid flag is expert opinion')}
 }
 let h='<h3>Results</h3>';if(!rows.length)return h+'<p class="empty">Enter any of the values above.</p>';

   <tr><th>Primary RF %</th><td>&lt;20</td><td>20–40</td><td>&gt;40</td><td><span class="ref">Severe: Myerson 2016 (outcome, circular). Mild &lt;20%: Steeds & Myerson 2020. Moderate: the gap between them</span></td></tr>

   <tr><th>Secondary RF %</th><td>&lt;20</td><td>20–34</td><td>≥35</td><td><span class="ref">Wang 2023 (outcome-derived moderate and severe)</span></td></tr></tbody></table></div>

  <span class="ref"><b>No CMR-specific severe-AS cutoff</b> has been validated against outcomes. Use CMR mainly when echo is discordant: CMR stroke volume for flow, planimetry for anatomy, CT calcium score as the tiebreaker.</span>

function prepCanvas(bmp){let sc=1;if(bmp.width<1800)sc=1800/bmp.width;if(bmp.width*sc>3000)sc=3000/bmp.width;const W=Math.round(bmp.width*sc),H=Math.round(bmp.height*sc);
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(bmp,0,0,W,H);
 const im=x.getImageData(0,0,W,H),d=im.data,hist=new Uint32Array(256);let sum=0;
 for(let i=0;i<d.length;i+=4){const g=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;d[i]=g;hist[g]++;sum+=g}
 const tot=W*H,inv=sum/tot<110;let lo=0,hi=255,acc=0;for(let i=0;i<256;i++){acc+=hist[i];if(acc>=tot*.01){lo=i;break}}acc=0;for(let i=255;i>=0;i--){acc+=hist[i];if(acc>=tot*.01){hi=i;break}}
 const r=Math.max(1,hi-lo);for(let i=0;i<d.length;i+=4){let v=(d[i]-lo)*255/r;v=v<0?0:v>255?255:v;if(inv)v=255-v;d[i]=d[i+1]=d[i+2]=v}
 x.putImageData(im,0,0);return c}
async function runScan(file){
 const prog=t=>{const e=document.getElementById('scanprog');if(e)e.textContent=t};
 scan.stage='busy';scan.msg='Preparing image…';scan.url=URL.createObjectURL(file);render();let worker=null,c=null;
 try{const bmp=await createImageBitmap(file);c=prepCanvas(bmp);if(bmp.close)bmp.close();
  prog('Loading text reader (first use downloads about 7 MB)…');await scanLoad(scanAbs('ocr/tesseract.min.js'));
  worker=await Tesseract.createWorker('eng',1,{workerPath:scanAbs('ocr/worker.min.js'),corePath:scanAbs('ocr/tesseract-core-simd-lstm.wasm.js'),langPath:scanAbs('ocr/lang'),workerBlobURL:false,cacheMethod:'none',gzip:true,
   logger:m=>{if(m.status)prog((m.status==='recognizing text'?'Reading text… ':m.status.charAt(0).toUpperCase()+m.status.slice(1)+'… ')+(m.progress!=null&&m.status==='recognizing text'?Math.round(m.progress*100)+'%':''))}});
  await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
  const r=await worker.recognize(c);const P=parseReport(r.data.text);
  if(!scan)return;scan.items=P.items;scan.sex=P.sex;scan.phi=P.phi;scan.stage='review';if(!P.phi)scanFill()}
 catch(e){if(scan){scan.stage='err';scan.msg=(e&&e.message)||'Could not read the image.'}}
 finally{if(worker)try{await worker.terminate()}catch(x){}if(c){c.width=c.height=0}}
 render()}
function scanClose(){if(scan&&scan.url)URL.revokeObjectURL(scan.url);scan=null}
function scanFill(){
 if(scan.phi)return;
 const set=(k,id,key,v)=>{if(k==='st')getState(ITEMS.find(i=>i.id===id))[key]=v;else avState[id][key]=v};
 for(const [k,id,key] of (scan.wrote||[]))set(k,id,key,'');
 scan.wrote=[];scan.opens=[];
 for(const it of scan.items){if(!it.inc)continue;const v=parseFloat(it.v);if(!(v>=0))continue;const s=String(v);
  if(it.k==='bsa'){setCase('bsa',s);continue}
  for(const t of CANON[it.k].to){set(t[0],t[1],t[2],s);scan.wrote.push(t);if(!scan.opens.includes(t[1]))scan.opens.push(t[1])}}
 if(scan.sex)setCase('sex',scan.sex);
 for(const id of scan.opens){const st=id==='ar-calc'||id==='as-calc'||id==='mr-calc'||id==='tr-calc'||id==='sten-calc'?avState[id]:null;if(st)st.example=false;else{const it=ITEMS.find(i=>i.id===id);if(it)getState(it).example=false}}}
const SN={'lv-vol':'LV','rv-vol':'RV','la-vol':'LA','ra-vol':'RA','ar-calc':'Aortic regurgitation','as-calc':'Aortic stenosis','mr-calc':'Mitral regurgitation','tr-calc':'Tricuspid regurgitation','sten-calc':'Mitral / pulmonic stenosis'};
function scanHTML(){
 if(!scan)return `<div class="card"><h3>Scan a report image</h3><p class="ref" style="margin:0 0 8px">Read measurements from a screenshot or photo of a report and fill the calculators. Everything is read on this device.</p>${SCAN_OK?'<div class="rbtns"><button class="primary" data-scan="start">Scan report image</button></div>':'<p class="ref">Scanning needs the website version of the app (it is not available in the offline single file).</p>'}</div>`;
 let h='<div class="card scan">';
 if(scan.stage==='warn'){h+=`<h3>Before you upload</h3><div class="phi"><b>Do not upload any protected health information (PHI).</b> Crop out or cover the patient's name, medical record number, date of birth, dates of service, accession numbers and any other identifier, and make sure no face or label is visible. Use only the measurement table.</div>
  <p class="ref">The image is read on this device only. It is never uploaded, stored or logged, and it is discarded when you finish.</p>
  <label class="ack"><input type="checkbox" data-scan="ack" ${scan.ack?'checked':''}> <span>I confirm this image contains no patient identifiers or other PHI.</span></label>
  <div class="rbtns">${scan.ack?'<label class="btn primary">Choose or take a photo<input type="file" accept="image/*" id="scanfile" hidden></label>':'<button class="primary" disabled>Choose or take a photo</button>'}<button data-scan="cancel">Cancel</button></div>`}
 else if(scan.stage==='busy')h+=`<h3>Reading the image</h3><p id="scanprog" class="ref">${esc(scan.msg||'')}</p><div class="rbtns"><button data-scan="cancel">Cancel</button></div>`;
 else if(scan.stage==='err')h+=`<h3>Could not read the image</h3><p class="ref">${esc(scan.msg)}</p><div class="rbtns"><button class="primary" data-scan="start">Try again</button><button data-scan="cancel">Close</button></div>`;
 else{h+=`<h3>Check the values</h3>`;
  if(scan.phi)h+=`<div class="phi"><b>This image may contain patient identifiers.</b> Possible identifiers were detected in the text. Discard it, crop or cover them, and scan again. Nothing has been stored or sent.</div>`;
  h+=`${scan.url?`<img class="scanimg" src="${scan.url}" alt="Your image, shown only on this device for checking">`:''}<p class="ref">Values were filled into the calculators automatically. Software can misread numbers, so compare each with the image and fix anything off; the calculators update as you edit.</p>`;
  if(!scan.items.length)h+=`<p class="empty">No measurements were recognized. Try a sharper, straight-on image of only the measurement table.</p>`;
  else h+=scan.items.map((it,i)=>`<div class="srow"><input type="checkbox" data-si="${i}" ${it.inc?'checked':''} aria-label="Use ${esc(it.l)}"><label for="sv${i}"><b>${esc(it.l)}</b><small>fills ${esc(it.w)}${it.note?' · '+esc(it.note):''}</small></label><input id="sv${i}" type="number" inputmode="decimal" step="any" data-sv="${i}" value="${esc(it.v)}"><span class="u">${esc(it.u)}</span></div>`).join('');
  if(scan.sex)h+=`<p class="ref">Sex detected: ${scan.sex==='f'?'female':'male'}. It will be applied.</p>`;
  h+=`<div class="rbtns">${scan.items.length?(scan.phi?'<p class="ref">Values were not filled because possible identifiers were found.</p>':(scan.opens||[]).map(id=>`<button data-open="${id}">Open ${SN[id]||id}</button>`).join(''))+'<button class="primary" data-scan="apply">Done, discard image</button>':''}<button data-scan="cancel">Discard image</button></div>`}
 return h+'</div>'}
function render(){
 if(current){const it=ITEMS.find(i=>i.id===current);app.innerHTML=it.kind==='table'?tableView(it):it.kind==='iron'?ironView(it):it.kind==='aocalc'?aoView(it):it.kind==='evidence'?evidenceView(it):it.kind==='avcalc'?avView(it):it.kind==='ecvcalc'?ecvView(it):calcView(it)}
 else app.innerHTML=tab==='home'?home():tab==='fav'?favView():tab==='report'?reportView():searchView();
 if(current)app.innerHTML=vgWrap(app.innerHTML,current);
 enhance();
 setupStrip();
 renderSide();
 if(!app.querySelector('.disc')){const d=document.createElement('p');d.className='foot disc';d.textContent='Educational reference only. Not medical advice. Independent project, not endorsed by OSU or SCMR.';app.appendChild(d)}
 ['home','fav','report','search'].forEach(t=>document.getElementById('nav-'+t).classList.toggle('on',!current&&tab===t));
 if(!current&&tab==='search'){const q=document.getElementById('q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
function openItem(id){current=resolveId(id);try{history.replaceState(null,'','#'+current)}catch(e){location.hash=current}render();window.scrollTo(0,0)}
function goBack(){current=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}render()}

app.addEventListener('click',e=>{
 const vt=e.target.closest('[data-vtab]');if(vt){if(vt.dataset.vv)avState['sten-calc'].v=vt.dataset.vv;current=vt.dataset.vtab;try{history.replaceState(null,'','#'+current)}catch(x){}render();return}
 const f=e.target.closest('[data-fav]');if(f){e.stopPropagation();toggleFav(f.dataset.fav);return}
 const sec=e.target.closest('[data-sec]');if(sec){const k=sec.dataset.sec;openSecs=openSecs.includes(k)?openSecs.filter(x=>x!==k):[...openSecs,k];try{localStorage.setItem('cmr-open',JSON.stringify(openSecs))}catch(_){}render();return}
 const o=e.target.closest('[data-open]');if(o){openItem(o.dataset.open);return}
 if(e.target.closest('[data-back]')){goBack();return}
 const sc=e.target.closest('[data-scan]');if(sc){const a=sc.dataset.scan;
  if(a==='start'){scanClose();scan={stage:'warn',ack:false}}else if(a==='cancel')scanClose();else if(a==='apply'){scanClose()}
  else if(a==='ack'){scan.ack=sc.checked}
  render();return}
 const cs=e.target.closest('[data-csex]');if(cs){setCase('sex',cs.dataset.csex);render();return}
 if(e.target.closest('[data-rclear]')){clearAll();render();return}
 const rc=e.target.closest('[data-rcopy]');if(rc){const t=document.getElementById('rtext'),m=document.getElementById('rmsg');const txt=rc.dataset.rcopy==='ab'?t.dataset.ab:t.dataset.all;t.textContent=txt;
  const fb=()=>{const r=document.createRange();r.selectNodeContents(t);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);m.textContent='Text selected. Press copy.'};
  try{navigator.clipboard.writeText(txt).then(()=>{m.textContent='Copied.'},fb)}catch(x){fb()}return}
 const it=current&&ITEMS.find(i=>i.id===current);if(!it)return;
 const ax=e.target.closest('[data-aosex]');if(ax){setCase('sex',ax.dataset.aosex);render();return}
 if(!it.methods)return;const s=getState(it);
 const m=e.target.closest('[data-method]');if(m){s.method=m.dataset.method;if(!it.methods[s.method].age)s.age='';render();return}
 const sx=e.target.closest('[data-sex]');if(sx){setCase('sex',sx.dataset.sex);render();return}
 const cx=e.target.closest('[data-ctx]');if(cx){s.ctx=cx.dataset.ctx;render();return}
 if(e.target.closest('[data-togglebsa]')){s.showBsa=!s.showBsa;render();return}
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();openItem(e.target.dataset.open)}});
app.addEventListener('change',e=>{
 if(e.target.dataset.si!=null&&scan){scan.items[+e.target.dataset.si].inc=e.target.checked;scanFill();render();return}
 if(e.target.id==='scanfile'&&scan&&scan.ack){const f=e.target.files&&e.target.files[0];if(f)runScan(f)}
});
app.addEventListener('input',e=>{
 if(e.target.dataset.sv!=null&&scan){scan.items[+e.target.dataset.sv].v=e.target.value;scanFill();return}
 if(e.target.id==='hq'){query=e.target.value;tab='search';render();return}
 if(e.target.id==='q'){query=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.setSelectionRange(pos,pos);return}
 if(e.target.matches('[data-cbsa]')){setCase('bsa',e.target.value);document.getElementById('rbody').innerHTML=reportBody();return}
 if(e.target.dataset.ao){aoState[e.target.dataset.ao]=e.target.value;if(e.target.dataset.ao==='bsa')setCase('bsa',e.target.value);aoState.example=false;if(e.target.dataset.ao==='lvl'){render();return}document.getElementById('results').innerHTML=aoResults();return}
 if(e.target.dataset.ecv){ecvState[e.target.dataset.ecv]=e.target.value;if(e.target.dataset.ecv==='f')ecvState.seq='';if(e.target.tagName==='SELECT'){render();return}document.getElementById('results').innerHTML=ecvResults();return}
 if(e.target.dataset.av){avState[current][e.target.dataset.av]=e.target.value;if(e.target.dataset.av==='bsa')setCase('bsa',e.target.value);if(e.target.tagName==='SELECT'){render();return}document.getElementById('results').innerHTML=avResults(current);return}
 if(e.target.dataset.iron){ironState[e.target.dataset.iron]=e.target.value;document.getElementById('results').innerHTML=ironResults();return}
 const k=e.target.dataset.in;if(!k||!current)return;const it=ITEMS.find(i=>i.id===current);const s=getState(it);s[k]=e.target.value;s.example=false;
 if(k==='h'||k==='w'){const h=parseFloat(s.h),w=parseFloat(s.w);if(h>0&&w>0){s.bsa=Math.sqrt(h*w/3600).toFixed(2);const b=document.getElementById('bsa-'+it.id);if(b)b.value=s.bsa}}
 if(k==='bsa'||k==='h'||k==='w')setCase('bsa',s.bsa);
 if(k==='age'){render();return}
 document.getElementById('results').innerHTML=resultsHTML(it);
});
document.getElementById('nav-home').onclick=()=>{current=null;tab='home';goBack()};
document.getElementById('nav-fav').onclick=()=>{current=null;tab='fav';goBack()};
document.getElementById('nav-report').onclick=()=>{current=null;tab='report';goBack()};
document.getElementById('nav-search').onclick=()=>{current=null;tab='search';goBack()};

const hid=(location.hash||'').slice(1);if(ITEMS.some(i=>i.id===hid))current=resolveId(hid);
render();
})();
</script>

<script>
(function(){
 // Offline support: register the service worker when served over http(s)
 if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
 }
 // Install prompt (Chrome/Edge/Android); iOS uses Share > Add to Home Screen
 var deferred=null;
 function banner(html){var d=document.getElementById('installbar');if(!d){d=document.createElement('div');d.id='installbar';d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;max-width:596px;margin:0 auto;background:var(--band);color:var(--band-ink);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.25)';document.body.appendChild(d)}d.innerHTML=html;return d}
 function dismissed(){try{return localStorage.getItem('cmr-install-dismissed')==='1'}catch(e){return false}}
 function dismiss(){try{localStorage.setItem('cmr-install-dismissed','1')}catch(e){}var d=document.getElementById('installbar');if(d)d.remove()}
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;if(dismissed())return;
  var d=banner('<span style="flex:1">Install CMR Reference for offline use in the reading room.</span><button id="ib-go" style="background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:7px 12px;font-weight:600;cursor:pointer">Install</button><button id="ib-x" aria-label="Dismiss" style="background:none;border:0;color:inherit;font-size:18px;cursor:pointer">×</button>');
  d.querySelector('#ib-go').onclick=function(){deferred.prompt();deferred.userChoice.finally(function(){deferred=null;dismiss()})};d.querySelector('#ib-x').onclick=dismiss});
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
 if(ios&&!standalone&&/^https:$/.test(location.protocol)&&!dismissed()){window.addEventListener('load',function(){var d=banner('<span style="flex:1">To install: tap <b>Share</b>, then <b>Add to Home Screen</b>. It then works offline.</span><button id="ib-x" aria-label="Dismiss" style="background:none;border:0;color:inherit;font-size:18px;cursor:pointer">×</button>');d.querySelector('#ib-x').onclick=dismiss})}
 // Offline status chip
 function net(){var c=document.getElementById('netchip');if(!navigator.onLine){if(!c){c=document.createElement('div');c.id='netchip';c.textContent='Offline · all data available';c.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15);background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:4px 10px;font:600 12px var(--body)';document.body.appendChild(c)}}else if(c)c.remove()}
 window.addEventListener('online',net);window.addEventListener('offline',net);net();
})();
</script>
