<title>CMR Reference</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first app column — hero band with search, quick calculator chips, chamber sections, detail view per tool, fixed bottom bar */
:root{
  --bg:#f1f1f6; --surface:#ffffff; --surface-2:#f6f6fa; --fg:#14172b; --muted:#585c75; --line:#dcdce8;
  --accent:#2d3a8c; --accent-ink:#ffffff; --accent-soft:#e3e6f7; --band:#1c2559; --band-2:#2d3a8c; --band-ink:#eef0fb;
  --ok:#00588a; --ok-soft:#dcebf7; --caution:#7a4d00; --caution-soft:#fdf0c4; --warn:#9b1f63; --warn-soft:#f7e0ee; --warn-solid:#9b1f63; --warn-ink:#ffffff;
  --info-soft:#e8eef9; --info:#2c4c8c; --shadow:0 1px 2px rgba(16,40,48,.06),0 4px 14px rgba(16,40,48,.06);
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f1d; --surface:#161a2e; --surface-2:#1d2238; --fg:#e8eaf6; --muted:#a0a5c4; --line:#2a3050;
  --accent:#9db0ff; --accent-ink:#0c1030; --accent-soft:#232a5a; --band:#121744; --band-2:#222b74; --band-ink:#e3e7ff;
  --ok:#6cc3f5; --ok-soft:#10304a; --caution:#f0d95c; --caution-soft:#3a3410; --warn:#f2a4cf; --warn-soft:#431a33; --warn-solid:#f2a4cf; --warn-ink:#3b0f28;
  --info-soft:#18243b; --info:#a3bbee; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f1d; --surface:#161a2e; --surface-2:#1d2238; --fg:#e8eaf6; --muted:#a0a5c4; --line:#2a3050;
  --accent:#9db0ff; --accent-ink:#0c1030; --accent-soft:#232a5a; --band:#121744; --band-2:#222b74; --band-ink:#e3e7ff;
  --ok:#6cc3f5; --ok-soft:#10304a; --caution:#f0d95c; --caution-soft:#3a3410; --warn:#f2a4cf; --warn-soft:#431a33; --warn-solid:#f2a4cf; --warn-ink:#3b0f28;
  --info-soft:#18243b; --info:#a3bbee; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.app{margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.band{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--band),var(--band-2));color:var(--band-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 22px;border-radius:0 0 22px 22px}
.band::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;border:26px solid currentColor;opacity:.07;box-shadow:0 0 0 30px transparent,inset 0 0 0 34px transparent;pointer-events:none}
.band::before{content:"";position:absolute;right:8px;top:-12px;width:104px;height:104px;border-radius:50%;border:14px solid currentColor;opacity:.06;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.mark{width:42px;height:42px;flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1.05}
.brand p{margin:3px 0 0;font-size:12px;opacity:.82;letter-spacing:.07em;text-transform:uppercase}
.hsearch{position:relative;margin-top:16px}
.hsearch input{width:100%;padding:12px 14px 12px 42px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:var(--band-ink);font:16px var(--body)}
.hsearch input::placeholder{color:var(--band-ink);opacity:.7}
.hsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.8}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;flex-direction:column;gap:12px}

.note{background:var(--info-soft);color:var(--info);border-radius:14px;padding:10px 14px;font-size:13px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (min-width:700px){.chips{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0 6px}}
#side{display:none}
@media (min-width:1100px){
 #side{display:block;position:fixed;top:calc(50% - 36px);transform:translateY(-50%);right:calc(50% + var(--aw)/2 + 16px);width:min(264px,calc(50vw - var(--aw)/2 - 32px));max-height:calc(100vh - 72px - 32px);overflow-y:auto;overscroll-behavior:contain;padding:14px 10px 16px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(20,23,43,.14),0 2px 6px rgba(20,23,43,.08);scrollbar-width:thin}
 #side .sidetitle{display:flex;align-items:center;gap:8px;margin:0 4px 8px;padding-bottom:10px;border-bottom:2px solid var(--accent);font:700 15px/1 var(--display);color:var(--fg)}
 #side .sidetitle svg{width:18px;height:18px;color:var(--accent)}
 #side h4{margin:16px 4px 5px;padding-left:8px;border-left:3px solid var(--accent);font:700 11.5px/1.2 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
 #side .sidetitle+h4{margin-top:4px}
 #side button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;margin:1px 0;border-radius:10px;color:var(--fg);font:500 14px/1.3 var(--body,inherit);font-family:inherit;cursor:pointer;transition:background .12s}
 #side button:hover{background:var(--accent-soft)}
 #side button.on{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:inset 4px 0 0 rgba(255,255,255,.55)}
 #side button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
}
.chip{flex:none;display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 10px;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.chip i{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 10.5px var(--mono);font-style:normal}
.chip:hover{border-color:var(--accent)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.group>button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;background:none;border:0;cursor:pointer;text-align:left}
.sicon{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.sicon svg{width:26px;height:26px}
.group>button .gt{flex:1;min-width:0;display:flex;flex-direction:column}
.group>button .gt b{font-family:var(--display);font-weight:600;font-size:19.5px;line-height:1.15}
.group>button .gt small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:18px;height:18px;transition:transform .2s;flex:none;color:var(--muted)}
.group.open .chev{transform:rotate(180deg)}
.items{display:none;border-top:1px solid var(--line)}
.group.open .items{display:block}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0} .item>.open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.item:hover{background:var(--surface-2)}
.ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none;border:1px solid var(--line)}
.ico.calc{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ico svg{width:16px;height:16px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:550;line-height:1.3}
.item .t small{color:var(--muted);font-size:12.5px}
.kind{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 5px;flex:none}
.fav{background:none;border:0;cursor:pointer;padding:6px;color:var(--muted);flex:none;border-radius:8px}
.fav.on{color:var(--warn)}
.fav svg{width:20px;height:20px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px 0}

/* detail */
.dhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:10px}
.dhead h2{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.2;text-wrap:balance}
.back{background:var(--surface-2);border:1px solid var(--line);cursor:pointer;padding:7px;border-radius:10px;display:grid;place-items:center}
.back svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent);flex:none}
#results{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.row{display:grid;grid-template-columns:118px 1fr 46px;align-items:center;gap:10px}
.row label{font-weight:500;font-size:14px;line-height:1.25}
.row .u{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
input[type=number],input[type=text],select{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--fg);font:500 16px var(--mono)}
input[type=text]{font-family:var(--body,inherit)}
select{font-family:var(--body);font-weight:500;font-size:15px}
input:focus,select:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--muted)}
.vtabs{margin:2px 0 12px}
.rstrip{position:sticky;top:calc(var(--dh,56px) + env(safe-area-inset-top,0px));z-index:4;display:flex;gap:6px 14px;align-items:center;overflow-x:auto;white-space:nowrap;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-size:13px;scrollbar-width:none}
.rstrip::-webkit-scrollbar{display:none}.rstrip .si{display:inline-flex;gap:6px;align-items:center;flex:none}.rstrip .si b{font-weight:600}.rstrip .si .v{font-family:var(--mono);font-weight:600}.rstrip .pill{font-size:12px;padding:2px 8px}
.rcase{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}.rcase .seg{flex:none}.rcase label{font-size:12px;color:var(--muted);font-weight:600}.rcase input{width:70px;min-width:0;padding:8px}.rcase .u{font-size:12px;color:var(--muted)}.rclr{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px}
.rcompact{padding:4px 12px}.rline{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}.rline:last-child{border-bottom:0}
.rn{flex:0 0 52px;text-align:left;border:0;background:none;padding:0;font:600 14px var(--display);color:var(--accent);cursor:pointer}
.rchips{display:flex;flex-wrap:wrap;gap:4px 12px;min-width:0}.rchips .si{display:inline-flex;gap:5px;align-items:center;font-size:13px}.rchips .si .v{font-family:var(--mono);font-weight:600}.rchips .pill{font-size:12px;padding:1px 7px}
.rsec h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.rsec h3 button{font-size:12px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
.rctx{font-size:12px;color:var(--muted);margin:-4px 0 6px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:baseline}
.frow:last-child{border-bottom:0}.frow b{font-weight:600}.frow small{display:block;color:var(--muted);font-size:12px}
.frow .fv{font-family:var(--mono);font-weight:600;white-space:nowrap}.frow .fg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center}.frow .pill{font-size:12px;padding:2px 8px}
.frow .fg .ref{font-size:11.5px;color:var(--muted)}
.rtext{white-space:pre-wrap;font:12px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:320px;overflow:auto;user-select:all}
.scan .phi{border:2px solid var(--fg);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:.92rem;background:var(--surface)}
.scan .ack{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-weight:600;cursor:pointer}.scan .ack input{width:22px;height:22px;flex:none;margin-top:1px}
.scan .btn{flex:1 1 auto;text-align:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-weight:600;cursor:pointer}.scan .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scan button:disabled{opacity:.5;cursor:not-allowed}
.scanimg{max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--line);display:block;margin:6px 0}
.srow{display:grid;grid-template-columns:auto 1fr 84px auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.srow label{min-width:0}.srow small{display:block;color:var(--muted);font-size:.75rem}.srow input[type=number]{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}.srow input[type=checkbox]{width:20px;height:20px}.srow .u{font-size:.8rem;color:var(--muted)}
.rbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.rbtns button{flex:1 1 auto;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;color:var(--fg)}.rbtns button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13.5px;font-weight:600;text-align:left}
.link::after{content:" →"}
.bsa-calc{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* results list */
.rlist{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.rrow:first-child{padding-top:2px}.rrow:last-child{border-bottom:0;padding-bottom:2px}
.rl b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.rl small{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.rv{font:600 21px var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rv.txt{font:600 14.5px var(--body)}
.rs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.rs .ref{flex:1 1 100%}
.rs .ref.num{flex:0 0 auto;font-size:12.5px}
.tbl tr.basis td{padding-top:0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.tbl tr.hasb th,.tbl tr.hasb td{border-bottom:0;padding-bottom:4px}
.rnote{padding:10px 0;border-bottom:1px solid var(--line)}.rnote:last-child{border-bottom:0}
.rb{grid-column:1/-1;position:relative;height:26px;margin:2px 6px 0}
.rb::before{content:"";position:absolute;left:0;right:0;top:5px;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.rb-n{position:absolute;top:5px;height:6px;border-radius:3px;background:var(--ok);opacity:.45}
.rb-m{position:absolute;top:0;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--muted);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.rb-m[data-d]{border-radius:0;outline:0;transform:none;clip-path:polygon(50% 0,100% 100%,0 100%);border:0;width:18px;height:16px;margin-left:-9px}.rb-m[data-d="down"]{clip-path:polygon(0 0,100% 0,50% 100%)}.rb-m.lo[data-d]{background:var(--caution)}
.rb-m.ok{background:var(--ok)}.rb-m.lo{background:var(--caution);border-radius:2px;transform:rotate(45deg) scale(.85);outline:1px solid var(--fg)}.rb-m.hi{background:var(--warn);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);border:0;width:18px;height:16px}
.rb-t{position:absolute;top:14px;transform:translateX(-50%);font:500 10.5px var(--mono);color:var(--muted)}

.res{width:100%;border-collapse:collapse;font-size:14px}
.res th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.res td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.res tr:last-child td{border-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.res td.num.v{font-weight:600;white-space:nowrap}
.pill{display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.35;max-width:100%}
.pill::before{content:"";width:8px;height:8px;background:currentColor;flex:none;transform:translateY(-1px)}
.pill.ok::before{border-radius:50%}
.pill.lo::before{transform:translateY(-1px) rotate(45deg);width:7px;height:7px}
.pill.hi::before{width:0;height:0;background:none;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid currentColor}
.pill.hi:not([data-d="up"]):not([data-d="down"])::before{width:8px;height:8px;background:currentColor;border:0;border-radius:1px;transform:translateY(-1px)}
.pill[data-d="up"]::before,.pill[data-d="down"]::before{width:0;height:0;background:none;border-radius:0;transform:translateY(-1px);border-left:5px solid transparent;border-right:5px solid transparent}
.pill[data-d="up"]::before{border-bottom:9px solid currentColor;border-top:0}
.pill[data-d="down"]::before{border-top:9px solid currentColor;border-bottom:0}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.lo{background:var(--caution-soft);color:var(--caution)}
.pill.hi{background:var(--warn-solid);color:var(--warn-ink)}
.pill.ok{border:1px solid currentColor}
.pill.lo{border:1px dashed currentColor}
.pill.na{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.tag::before{display:none}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.ref{font-size:13px;color:var(--muted);line-height:1.5}
.ref b{color:var(--fg);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:baseline}

const EV_PAGES={
 'lv-ev':{list:()=>LV_EV,bottom:`<li><b>LVEDVi:</b> Kang 2026 is the only sex-specific graded scheme on CMR. Only severe (≥200 men, ≥170 women) is outcome-derived; moderate is a midpoint and mild is the normal limit. Valid for DCM/ICM with papillary muscles in the blood pool; not for valve disease or preserved LVEF.</li>
  <li><b>LVESVi:</b> no graded outcome scheme anywhere. Reference flag in general; ≥45 mL/m² in aortic regurgitation (Hashimoto 2022).</li>
  <li><b>LVEF:</b> below the normal limit is validated (MESA). Severity uses HF guideline categories (≤40, 41–49), which are trial/echo-based. Above 70% is a risk marker, not a diagnosis.</li>
  <li><b>LV mass:</b> outcome risk starts at +1 SD in men and +2 SD in women (MESA), so the flag is sex-specific.</li>
  <li><b>Small LV:</b> U-shaped risk in two cohorts; a small LV with high EF may deserve a comment.</li>
  <li><b>Critiques:</b> no editorial targets the Kang tiers. Criticism is methodological: SD limits were unvalidated until MESA 2025, contouring changes mass and volumes, and supranormal LVEF is debated.</li>`},
 'la-ev':{list:()=>LA_EV,bottom:`<li><b>Max LAVi:</b> only one outcome-validated CMR scale (Khan 2019, biplane): moderate >62 and severe >73 mL/m² predicted death. Simpson volumes rely on the untested EACVI partitions.</li>
  <li><b>Min LAVi:</b> often more prognostic than max, but no tiers yet.</li>
  <li><b>LACI:</b> >25% predicted AF and HF in MESA; disease-specific cutoffs vary widely.</li>
  <li><b>LA strain:</b> prognostic but software-dependent; not graded.</li>
  <li><b>Echo cutoffs:</b> do not apply. The healthy CMR mean (about 36 mL/m²) already exceeds the echo threshold of 34.</li>
  <li><b>Critiques:</b> no letter or editorial targeting a specific CMR LA cutoff was found; criticism is methodological (SD-based limits, small samples, method dependence).</li>`},
 'tr-ev':{list:()=>TR_EV,bottom:`<li><b>TRF:</b> hazard ratio &gt;1 from 20% and &gt;2 from 40% (Margonato 2025, censored at intervention; the paper does not define mild/moderate/severe), highest risk ≥50% (Zhan 2020). No cutoff replicated independently.</li>
  <li><b>RV:</b> effective RVEF ≤25% is the only externally validated TR-related CMR cutoff. Hinojar 2025 RVEDVi/RVEF tiers for severe TR.</li>
  <li><b>Method:</b> all cutoffs assume RV stroke volume − pulmonary forward flow; 4D flow values are not interchangeable.</li>
  <li><b>Critiques:</b> ASE says CMR TR grading is unvalidated; no reproducibility data; editorials on Zhan and Wang not reviewed in full.</li>`},
 'mr-ev':{list:()=>MR_EV,bottom:`<li><b>Primary MR:</b> severe RF &gt;40% and RVol &gt;55 mL (Myerson 2016, circular endpoint); RVol ≥60 mL predicted death (Penicka 2018). Mild limit (&lt;20%) from Steeds & Myerson 2020; the moderate band is not outcome-derived.</li>
  <li><b>Secondary MR:</b> RF ≥20% moderate and ≥35% severe, outcome-derived (Wang 2023, single institution). Prognostic weight depends on scar. RVol not graded.</li>
  <li><b>Method:</b> cutoffs assume LV stroke volume − aortic forward flow; mitral inflow gives lower thresholds (Polte 2017).</li>
  <li><b>Echo cutoffs:</b> RF ≥50% under-calls CMR severity; echo RVol runs 8–17 mL higher.</li>
  <li><b>MVP:</b> papillary/inferolateral LGE predicts arrhythmic events; annular disjunction alone does not.</li>
  <li><b>Critiques:</b> no letter disputes the cutoffs directly; editorials stress method dependence and reading RF with scar.</li>`},
 'av-ev':{list:()=>AV_EV,bottom:`<li><b>AR (used in the calculator):</b> severe RF ≥32% (Hashimoto 2022; Myerson 2012 &gt;33%), LVESVi ≥45 mL/m² (Hashimoto), LVEDV &gt;246 mL (Myerson); RVol &gt;40 mL direct (Polte 2017). Mild &lt;15% from Steeds & Myerson. Moderate is not outcome-derived.</li>
  <li><b>AR alternatives not used:</b> Malahfji 2023 (RF 43%, RVol 47 mL, LVESVi 43, LVEDVi 109) and the echo-borrowed RF ≥50%.</li>
  <li><b>Circularity:</b> most AR studies count surgery as an outcome; Hashimoto and Kammerlander are the cleanest.</li>
  <li><b>AS:</b> no CMR-specific severe cutoff. Planimetry reads larger and phase contrast reads lower than echo, so echo thresholds under-call severity on CMR.</li>
  <li><b>AS myocardium:</b> LGE and ECV &gt;27% predict death, but EVOLVED did not show that early AVR for fibrosis improves the primary outcome.</li>
  <li><b>Critiques:</b> no letters target specific cutoffs. Criticism centres on surgical endpoints, flow-measurement error, indexing in women and borrowed echo numbers.</li>`},
 'rv-ev':{list:()=>RV_EV,bottom:`<li><b>RVEF:</b> the best-supported RV metric. General-population RVEF severity tiers are not shown: the 45/40/30% partitions come from 3D echocardiography. Disease-specific cutoffs are shown in context: TR &lt;50% high risk (Hinojar 2025), PAH &lt;37% high risk (ASPIRE).</li>
  <li><b>RV/LV ratio:</b> only severe (≥2.30) is outcome-derived, from 8 deaths in 62 PH patients; mild and moderate are not outcome-distinct. Not usable with biventricular dilation or a small LV.</li>
  <li><b>RVEDVi/RVESVi:</b> reference flags only in general; TR (100/150 mL/m²) and repaired TOF (RVESVi &gt;80) have disease-specific thresholds. ARVC volume criteria are diagnostic, not prognostic.</li>
  <li><b>MESA:</b> RVESVi and RVEF beyond 2 SD did not predict events in asymptomatic adults, so RV grading matters most in known disease.</li>
  <li><b>Critiques:</b> none target Altmayer directly. Badano and Al'Aref debated graded vs single RVEF cutoffs; letters criticise the ARVC volume cutoffs; Pastor 2020 challenges TOF PVR thresholds.</li>`}

function rangeFor(lab,u){const L=lab.toLowerCase();
 if(/^bsa/.test(L)||u==='m²')return [0.5,3.5,'BSA is usually 0.5–3.5 m²'];
 if(/height/.test(L))return /\(in\)/.test(L)?[35,90,'Height is usually 35–90 in']:[90,230,'Height is usually 90–230 cm'];
 if(/weight/.test(L))return /\(lb\)/.test(L)?[35,660,'Weight is usually 35–660 lb']:[15,300,'Weight is usually 15–300 kg'];
 if(/hematocrit|hct/.test(L))return [15,65,'Hematocrit is usually 15–65 %'];
 if(u==='years'||/^age/.test(L))return [1,110,'Age is in years, 1–110'];
 if(/strain/.test(L))return [-100,100,'Check the strain value'];
 if(u==='%')return [0,100,'A percentage must be 0–100'];
 if(u==='mL')return [0,800,'Volume looks too large for mL; check the value'];
 if(u==='g')return [0,700,'Mass looks too large for grams; check the value'];
 if(u==='cm²')return [0,80,'Area looks too large for cm²; check the value'];
 if(u==='cm')return [0,15,'Length looks too large for cm; check the value'];
 if(u==='mm')return [0,150,'Diameter looks too large for mm; check the value'];
 if(u==='mmHg')return [0,300,'Gradient looks too high for mmHg; check the value'];
 if(u==='m/s')return [0,9,'Velocity looks too high for m/s; check the value'];
 if(u==='cm/s')return [0,900,'Velocity looks too high for cm/s; check the value'];
 if(u==='ms')return [0,3000,'Check the value in ms'];
 return null}

function validate(){let bad=0;app.querySelectorAll('.vmsg,#warnbar').forEach(x=>x.remove());
 app.querySelectorAll('.row input[type=number]').forEach(inp=>{inp.classList.remove('bad');inp.removeAttribute('aria-invalid');
  const row=inp.closest('.row');if(!row)return;const lab=((row.querySelector('label')||{}).textContent||'').trim(),u=((row.querySelector('.u')||{}).textContent||'').trim();
  if(inp.value===''||!isFinite(parseFloat(inp.value)))return;const v=parseFloat(inp.value),r=rangeFor(lab,u);if(!r)return;
  if(v<r[0]||v>r[1]){bad++;inp.classList.add('bad');inp.setAttribute('aria-invalid','true');row.insertAdjacentHTML('afterend',`<div class="vmsg" role="alert">${esc(r[2])}.</div>`)}});
 const res=document.getElementById('results');if(res){res.classList.toggle('held',bad>0);if(bad)res.insertAdjacentHTML('beforebegin',`<div id="warnbar" class="warnbar" role="status"><b>Some values look wrong.</b> Results are paused until the highlighted entries are corrected.</div>`)}
 if(window.__stripUpd)window.__stripUpd()}
function postUI(){const res=document.getElementById('results');document.body.classList.toggle('calcpage',!!res);app.classList.toggle('calc',!!res);
 if(res){const wrap=res.parentElement;if(wrap&&wrap.classList.contains('wrap')){let p=res.previousElementSibling;while(p&&!p.classList.contains('card'))p=p.previousElementSibling;
   if(p){p.classList.add('incard');wrap.classList.add('two');if(!p.querySelector('[data-reset]'))p.insertAdjacentHTML('beforeend','<div class="ibtns"><button class="link" data-reset>Clear this page (keeps population and BSA)</button><button class="link" data-newpt>New patient (clears everything)</button><button class="link" data-copyres>Copy result</button></div>')}}}
 validate()}
app.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('.row input'));clearTimeout(vtimer);vtimer=setTimeout(validate,650)});
app.addEventListener('change',()=>validate());
app.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('keyd'))window.__ko=e.target.open},true);
function render(){
 if(current){const it=ITEMS.find(i=>i.id===current);app.innerHTML=it.kind==='table'?tableView(it):it.kind==='iron'?ironView(it):it.kind==='aocalc'?aoView(it):it.kind==='evidence'?evidenceView(it):it.kind==='avcalc'?avView(it):it.kind==='ecvcalc'?ecvView(it):calcView(it)}
 else app.innerHTML=tab==='home'?home():tab==='fav'?favView():tab==='report'?reportView():searchView();
 if(current)app.innerHTML=vgWrap(app.innerHTML,current);
 enhance();
 setupStrip();
 postUI();
 app.querySelectorAll('.seg:not(.vtabs) button').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('on')?'true':'false'));
 app.querySelectorAll('.scroll').forEach(x=>{x.tabIndex=0;x.setAttribute('role','region');x.setAttribute('aria-label','Scrollable table')});
 renderSide();
 if(!app.querySelector('.disc')){const d=document.createElement('p');d.className='foot disc';d.textContent='Educational reference only. Not medical advice. Independent project, not endorsed by OSU or SCMR.';app.appendChild(d)}
 ['home','fav','report','search'].forEach(t=>document.getElementById('nav-'+t).classList.toggle('on',!current&&tab===t));
 if(!current&&tab==='search'){const q=document.getElementById('q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
function openItem(id){current=resolveId(id);pushRecent(current);try{history.replaceState(null,'','#'+current)}catch(e){location.hash=current}render();window.scrollTo(0,0)}
function goBack(){current=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}render()}

app.addEventListener('click',e=>{
 const vt=e.target.closest('[data-vtab]');if(vt){if(vt.dataset.vv)avState['sten-calc'].v=vt.dataset.vv;current=vt.dataset.vtab;try{history.replaceState(null,'','#'+current)}catch(x){}render();return}
 const f=e.target.closest('[data-fav]');if(f){e.stopPropagation();toggleFav(f.dataset.fav);return}
 const sec=e.target.closest('[data-sec]');if(sec){const k=sec.dataset.sec;openSecs=openSecs.includes(k)?openSecs.filter(x=>x!==k):[...openSecs,k];try{localStorage.setItem('cmr-open',JSON.stringify(openSecs))}catch(_){}render();return}
 const o=e.target.closest('[data-open]');if(o){openItem(o.dataset.open);return}
 if(e.target.closest('[data-back]')){goBack();return}
 const sc=e.target.closest('[data-scan]');if(sc){const a=sc.dataset.scan;
  if(a==='start'){scanClose();scan={stage:'warn',ack:false}}else if(a==='cancel')scanClose();else if(a==='apply'){if(scan&&!scan.phi)scanFill();scanClose()}
  else if(a==='ack'){scan.ack=sc.checked}
  render();return}
 const irf=e.target.closest('[data-ironf]');if(irf){ironState.cf=irf.dataset.ironf;render();return}
 const cs=e.target.closest('[data-csex]');if(cs){setCase('sex',cs.dataset.csex);render();return}
 if(e.target.closest('[data-rclear]')||e.target.closest('[data-newpt]')){clearAll();render();return}
 const rc=e.target.closest('[data-rcopy]');if(rc){const t=document.getElementById('rtext'),m=document.getElementById('rmsg');const txt=rc.dataset.rcopy==='ab'?t.dataset.ab:t.dataset.all;t.textContent=txt;
  const fb=()=>{const r=document.createRange();r.selectNodeContents(t);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);m.textContent='Text selected. Press copy.'};
  try{navigator.clipboard.writeText(txt).then(()=>{m.textContent='Copied.';const o=rc.textContent;rc.textContent='Copied ✓';setTimeout(()=>{rc.textContent=o},1600)},fb)}catch(x){fb()}return}
 if(e.target.closest('[data-lrtoggle]')){lrOpen=!lrOpen;render();return}
 if(e.target.closest('[data-lropen]')){lrOpen=true;render();const c=document.getElementById('lrcard');if(c)c.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(e.target.closest('[data-lrclear]')){delete LOCAL[ecvState.f];saveLocal();render();return}
 if(e.target.closest('[data-tipx]')){try{localStorage.setItem('cmr-tip','1')}catch(x){}render();return}
 if(e.target.closest('[data-install]')&&deferredInstall){deferredInstall.prompt();deferredInstall=null;return}
 if(e.target.closest('[data-reset]')){resetCurrent();return}
 const cr=e.target.closest('[data-copyres]');if(cr&&current){copyResult(cr);return}
 const it=current&&ITEMS.find(i=>i.id===current);if(!it)return;
 if(e.target.closest('[data-setopen]')){const st=getState(it);st.setOpen=!st.setOpen;render();return}
 if(e.target.closest('[data-units]')){const st=getState(it);const f=st.imp?1/2.54:2.54,g=st.imp?1/0.45359237:0.45359237;st.imp=!st.imp;if(parseFloat(st.h)>0)st.h=(st.h*f).toFixed(1);if(parseFloat(st.w)>0)st.w=(st.w*g).toFixed(1);render();return}
 const ax=e.target.closest('[data-aosex]');if(ax){setCase('sex',ax.dataset.aosex);render();return}
 if(!it.methods)return;const s=getState(it);
 const m=e.target.closest('[data-method]');if(m){s.method=m.dataset.method;if(!it.methods[s.method].age)s.age='';render();return}
 const sx=e.target.closest('[data-sex]');if(sx){setCase('sex',sx.dataset.sex);render();return}
 const cx=e.target.closest('[data-ctx]');if(cx){s.ctx=cx.dataset.ctx;render();return}
 if(e.target.closest('[data-togglebsa]')){s.showBsa=!s.showBsa;render();return}
 if(e.target.closest('[data-atrtoggle]')){s.vOpen=!s.vOpen;render();return}
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();openItem(e.target.dataset.open)}});
app.addEventListener('change',e=>{
 if(e.target.dataset.si!=null&&scan){scan.items[+e.target.dataset.si].inc=e.target.checked;scanFill();render();return}
 if(e.target.id==='scanfile'&&scan&&scan.ack){const f=e.target.files&&e.target.files[0];if(f)runScan(f)}
});
app.addEventListener('input',e=>{
 if(e.target.dataset.lr!=null){const f=ecvState.f;(LOCAL[f]=LOCAL[f]||{})[e.target.dataset.lr]=e.target.value;saveLocal();const r=document.getElementById('results');if(r)r.innerHTML=ecvResults();const sm=document.getElementById('lrsum');if(sm)sm.textContent=lrSummary(f);const nt=document.getElementById('lrnote');if(nt)nt.textContent=lrNote(f);return}
 if(e.target.dataset.sv!=null&&scan){scan.items[+e.target.dataset.sv].v=e.target.value;return}
 if(e.target.id==='hq'){query=e.target.value;tab='search';render();return}
 if(e.target.id==='q'){query=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.setSelectionRange(pos,pos);return}
 if(e.target.matches('[data-cbsa]')){setCase('bsa',e.target.value);document.getElementById('rbody').innerHTML=reportBody();return}
 if(e.target.dataset.ao){aoState[e.target.dataset.ao]=e.target.value;if(e.target.dataset.ao==='bsa')setCase('bsa',e.target.value);aoState.example=false;if(e.target.dataset.ao==='lvl'){render();return}document.getElementById('results').innerHTML=aoResults();return}
 if(e.target.dataset.ecv){ecvState[e.target.dataset.ecv]=e.target.value;if(e.target.dataset.ecv==='f')ecvState.seq='';if(e.target.tagName==='SELECT'){render();return}document.getElementById('results').innerHTML=ecvResults();return}
 if(e.target.dataset.av){avState[current][e.target.dataset.av]=e.target.value;if(e.target.dataset.av==='bsa')setCase('bsa',e.target.value);if(e.target.tagName==='SELECT'){render();return}document.getElementById('results').innerHTML=avResults(current);return}
 if(e.target.dataset.iron){ironState[e.target.dataset.iron]=e.target.value;document.getElementById('results').innerHTML=ironResults();return}
 const k=e.target.dataset.in;if(!k||!current)return;const it=ITEMS.find(i=>i.id===current);const s=getState(it);s[k]=e.target.value;s.example=false;
 if(k==='h'||k==='w'){const h=parseFloat(s.h),w=parseFloat(s.w);if(h>0&&w>0){s.bsa=Math.sqrt((s.imp?h*2.54:h)*(s.imp?w*0.45359237:w)/3600).toFixed(2);const b=document.getElementById('bsa-'+it.id);if(b)b.value=s.bsa}}
 if(k==='bsa'||k==='h'||k==='w')setCase('bsa',s.bsa);
 if(k==='age'){render();return}
 if(k.startsWith('v_')){atrCalcUpd(it,s)}
 document.getElementById('results').innerHTML=resultsHTML(it);
});
document.getElementById('nav-home').onclick=()=>{current=null;tab='home';goBack()};
document.getElementById('nav-fav').onclick=()=>{current=null;tab='fav';goBack()};
document.getElementById('nav-report').onclick=()=>{current=null;tab='report';goBack()};
document.getElementById('nav-search').onclick=()=>{current=null;tab='search';goBack()};

const hid=(location.hash||'').slice(1);if(ITEMS.some(i=>i.id===hid))current=resolveId(hid);
render();
})();
</script>
